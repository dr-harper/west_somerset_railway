name: Preview PR

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/wsr-railway-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app/wsr-railway-app

      - name: Build
        run: npm run build
        working-directory: app/wsr-railway-app
        env:
          # A preview channel serves from its own subdomain, at the root, so
          # there is no path prefix to build in — unlike the gh-pages preview
          # this replaces, which needed the PR number baked into every asset
          # URL and so never quite matched what main would look like.
          BASE_PATH: /
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: west-somerset-railway-project
          # Channels expire on their own, which is why the cleanup workflow
          # that deleted gh-pages directories on close is gone rather than
          # rewritten. The action comments the URL on the PR itself.
          channelId: pr-${{ github.event.number }}
          expires: 7d
