name: Deploy Main

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  # Lets the job ask GitHub for a signed token proving which repository it is.
  # That token is what Google trusts, which is why no key is stored here.
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 18 stopped being enough on 29 August: the toolchain wants
          # ^20.19 || ^22.13 || >=24, and every deploy failed on EBADENGINE.
          # Nobody noticed, because a failed deploy leaves the last good site
          # in place and says nothing.
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/wsr-railway-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app/wsr-railway-app

      - name: Build
        run: npm run build
        working-directory: app/wsr-railway-app
        env:
          # Served from the root of its own domain, so no path prefix. The
          # /west_somerset_railway/ prefix Pages needed has caused at least
          # one bug on its own.
          BASE_PATH: /
          # Repository variables, not secrets: every one of these compiles
          # into the client bundle and is visible to anyone who opens the
          # site. They identify the project; they authorise nothing, which
          # the Firestore rules do.
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      # The firebase CLI rather than FirebaseExtended/action-hosting-deploy,
      # which takes only a service account key and cannot use federated
      # credentials. The CLI reads GOOGLE_APPLICATION_CREDENTIALS, which the
      # auth step above writes as a short-lived file — so the keyless path
      # holds rather than being abandoned for a JSON key in a secret.
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@14 deploy --only hosting --project west-somerset-railway-project --non-interactive
        env:
          # Named explicitly rather than relying on the auth step exporting
          # it. Without this the CLI found no credentials and asked whether
          # anyone had run `firebase login`, which reads as a missing login
          # and is actually an environment variable not arriving.
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
