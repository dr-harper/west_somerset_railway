name: Deploy Main

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 18 stopped being enough on 29 August: the toolchain wants
          # ^20.19 || ^22.13 || >=24, and every deploy failed on EBADENGINE.
          # Nobody noticed, because a failed deploy leaves the last good site
          # in place and says nothing.
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/wsr-railway-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app/wsr-railway-app

      - name: Build
        run: npm run build
        working-directory: app/wsr-railway-app
        env:
          # Served from the root of its own domain, so no path prefix. The
          # /west_somerset_railway/ prefix Pages needed has caused at least
          # one bug on its own.
          BASE_PATH: /
          # Repository variables, not secrets: every one of these compiles
          # into the client bundle and is visible to anyone who opens the
          # site. They identify the project; they authorise nothing, which
          # the Firestore rules do.
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}

      # A key, reluctantly. Workload Identity Federation is provisioned and is
      # the right primitive for GCP generally, but the Firebase CLI reads
      # GOOGLE_APPLICATION_CREDENTIALS only for service account keys and
      # cannot use the external-account file federation produces. Three
      # attempts failed with "have you run firebase login", which reads as a
      # missing login and is actually an unsupported credential type.
      #
      # So the blast radius is kept small instead of the key being avoided:
      # this account may write Hosting and nothing else. It cannot read
      # detections, reach the captures, see the Gemini secret, or touch the
      # machine.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: west-somerset-railway-project
          channelId: live
