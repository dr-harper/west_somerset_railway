name: Deploy Main

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 18 stopped being enough on 29 August: the toolchain now wants
          # ^20.19 || ^22.13 || >=24, and every deploy since has failed on
          # EBADENGINE. Nobody noticed because a failed deploy leaves the
          # last good site in place and says nothing.
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/wsr-railway-app/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        working-directory: app/wsr-railway-app
        
      - name: Build
        run: npm run build
        working-directory: app/wsr-railway-app
        env:
          BASE_PATH: /west_somerset_railway/
          # A repository variable, not a secret: the project id is compiled
          # into the client bundle and visible to anyone who opens the site.
          # Firebase identifies a project by it; it does not authorise
          # anything, which the security rules do.
          #
          # Left unset until Firestore exists in the project. An app pointed
          # at a database that is not there renders "not configured" and
          # shows nothing, which is worse than the current state, so this is
          # the last switch to throw rather than the first.
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: app/wsr-railway-app/dist
          keep_files: false