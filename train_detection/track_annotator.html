<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WSR track annotator</title>
<style>
  :root {
    --paper: #F3EBDA; --paper-raised: #FAF4E6; --paper-deep: #EADFC6;
    --chocolate: #3E2723; --chocolate-deep: #2B1B17;
    --ink: #2A211C; --ink-soft: #6B5D52; --brass: #C9A227;
    --brunswick: #1E4735; --signal-red: #B5342A;
    --rule: rgba(62,39,35,.28); --rule-strong: rgba(62,39,35,.55);
    --rail-a: #FFB43A; --rail-b: #7FC97F; --block: #DC3C3C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.5 'Cabin', 'Gill Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--chocolate); color: var(--paper);
    padding: 10px 16px; border-bottom: 3px solid var(--brass);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 {
    margin: 0; font-size: 1rem; letter-spacing: .14em;
    text-transform: uppercase; font-weight: 600;
  }
  #cameraPicker { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  #saveState { font-size: .8rem; color: var(--brass); min-width: 90px; }

  main { max-width: 1040px; margin: 0 auto; padding: 14px 16px 40px; }

  /* Mode is the primary choice, so it looks like one rather than hiding
     in a dropdown among seven other controls. */
  .modes { display: flex; gap: 2px; margin-bottom: 12px; }
  .mode {
    flex: 1; padding: 11px 8px; border: 1px solid var(--rule);
    background: var(--paper-raised); color: var(--ink-soft);
    font-family: inherit; font-size: .82rem; letter-spacing: .08em;
    text-transform: uppercase; cursor: pointer; border-radius: 3px;
  }
  .mode[aria-pressed="true"] {
    background: var(--chocolate); color: var(--paper); border-color: var(--chocolate);
  }
  .mode small { display: block; font-size: .68rem; letter-spacing: 0; text-transform: none; opacity: .75; }

  /* One toolbar, rebuilt per mode, showing only what that mode needs. */
  .toolbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 12px; background: var(--paper-raised);
    border: 1px solid var(--rule); border-radius: 3px 3px 0 0; border-bottom: none;
    min-height: 52px;
  }
  .spacer { flex: 1; }
  select, button {
    font: inherit; font-size: .9rem; padding: 7px 11px; border-radius: 3px;
    border: 1px solid var(--rule-strong); background: var(--paper);
    color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--brunswick); color: var(--paper); border-color: transparent; }
  button.danger  { background: var(--signal-red); color: var(--paper); border-color: transparent; }
  button.on      { background: var(--brass); border-color: var(--brass); color: var(--chocolate-deep); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }

  .canvasWrap {
    position: relative; line-height: 0;
    border: 1px solid var(--rule); border-radius: 0; overflow: hidden;
  }
  canvas { width: 100%; height: auto; cursor: crosshair; touch-action: none; display: block; }

  #loupe {
    position: absolute; top: 8px; right: 8px; width: 132px; height: 132px;
    border: 2px solid var(--brass); border-radius: 50%; overflow: hidden;
    display: none; background: #111; pointer-events: none; z-index: 5;
  }
  #loupe.visible { display: block; }
  #loupe canvas { width: 100%; height: 100%; }

  .statusbar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; font-size: .86rem; color: var(--ink-soft);
    background: var(--paper-raised); border: 1px solid var(--rule);
    border-top: none; border-radius: 0 0 3px 3px;
  }
  .warn { color: var(--signal-red); font-weight: 600; }
  .hint { color: var(--ink-soft); font-size: .88rem; margin: 12px 0 0; }

  /* Progress across every camera, so what is left is visible at a glance. */
  .progress { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .chip {
    font-size: .74rem; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--rule); background: var(--paper-raised);
    color: var(--ink-soft); cursor: pointer; white-space: nowrap;
  }
  .chip.done { border-color: var(--brunswick); color: var(--brunswick); }
  .chip.current { background: var(--chocolate); color: var(--paper); border-color: var(--chocolate); }

  @media (max-width: 700px) {
    main { padding: 10px; }
    header { padding: 8px 12px; }
    h1 { font-size: .85rem; }
    .mode { padding: 10px 4px; font-size: .72rem; }
    .mode small { display: none; }
    select, button { padding: 9px 10px; }
    #loupe { width: 108px; height: 108px; }
  }
</style>
</head>
<body>
<header>
  <h1>Track annotator</h1>
  <div id="cameraPicker">
    <select id="camera"></select>
    <span id="saveState"></span>
  </div>
</header>

<main>
  <div class="modes">
    <button class="mode" data-mode="paint" aria-pressed="true">
      Block out<small>drag over what is never a train</small></button>
    <button class="mode" data-mode="rails" aria-pressed="false">
      Trace rails<small>both rails of each road</small></button>
    <button class="mode" data-mode="regions" aria-pressed="false">
      Regions<small>platforms, obstructions</small></button>
  </div>

  <div class="toolbar" id="toolbar"></div>

  <div class="canvasWrap">
    <canvas id="canvas" width="854" height="480"></canvas>
    <div id="loupe"><canvas id="loupeCanvas" width="132" height="132"></canvas></div>
  </div>

  <div class="statusbar">
    <span id="status"></span>
    <span class="spacer"></span>
    <label style="font-size:.8rem"><input type="checkbox" id="showOthers" checked> show other layers</label>
  </div>

  <p class="hint" id="hint"></p>
  <div class="progress" id="progress"></div>
</main>

<script>
const CAMERAS = [
  ['bishops_lydeard', 'Bishops Lydeard'],
  ['crowcombe_heathfield', 'Crowcombe 1'],
  ['crowcombe_heathfield_2', 'Crowcombe 2'],
  ['williton', 'Williton 1'],
  ['williton_2', 'Williton 2'],
  ['watchet_1', 'Watchet 1'],
  ['watchet_visitor_centre', 'Watchet 2'],
  ['blue_anchor', 'Blue Anchor 1'],
  ['blue_anchor_2', 'Blue Anchor 2'],
  ['minehead_seaward_crossing', 'Seaward Crossing'],
  ['minehead_station', 'Minehead'],
];
const PAINT_W = 32, PAINT_H = 18, MIN_GAUGE = 14, LOUPE_ZOOM = 4;
const TRACK_NAMES = ['running line', 'loop', 'siding', 'shed road'];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const cameraSelect = document.getElementById('camera');
const toolbar = document.getElementById('toolbar');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const progressEl = document.getElementById('progress');
const saveState = document.getElementById('saveState');
const showOthers = document.getElementById('showOthers');
const loupe = document.getElementById('loupe');
const loupeCtx = document.getElementById('loupeCanvas').getContext('2d');

let tracks = {};
let image = new Image();
let mode = 'paint';
let dragging = null;
let lastPaint = null;
let erasing = false;
let trackIndex = 0, regionIndex = 0, rail = 'a';
let dirty = false;

CAMERAS.forEach(([id, label]) => cameraSelect.appendChild(new Option(label, id)));

// ---- data --------------------------------------------------------------

function camera() {
  const id = cameraSelect.value;
  if (!tracks[id]) tracks[id] = {};
  const entry = tracks[id];
  if (entry.rails && !entry.tracks) {          // migrate a legacy single pair
    entry.tracks = [{ name: 'running line', kind: 'running', rails: entry.rails }];
    delete entry.rails;
  }
  if (!entry.tracks) entry.tracks = [];
  if (!entry.regions) entry.regions = [];
  if (!entry.mask_cells) entry.mask_cells = { grid: [PAINT_W, PAINT_H], cells: [] };
  return entry;
}
function activeTrack() {
  const list = camera().tracks;
  return list.length ? list[Math.min(trackIndex, list.length - 1)] : null;
}
function activeRegion() {
  const list = camera().regions;
  return list.length ? list[Math.min(regionIndex, list.length - 1)] : null;
}
function editablePoints() {
  if (mode === 'rails') {
    const track = activeTrack();
    if (!track) return null;
    if (!track.rails) track.rails = { a: [], b: [] };
    if (!track.rails[rail]) track.rails[rail] = [];
    return track.rails[rail];
  }
  if (mode === 'regions') {
    const region = activeRegion();
    if (!region) return null;
    if (!region.points) region.points = [];
    return region.points;
  }
  return null;
}

// ---- toolbar, rebuilt per mode ----------------------------------------

function el(html) {
  const holder = document.createElement('div');
  holder.innerHTML = html.trim();
  return holder.firstElementChild;
}

function buildToolbar() {
  toolbar.innerHTML = '';
  const add = node => toolbar.appendChild(node);

  if (mode === 'paint') {
    const erase = el(`<button class="${erasing ? 'on' : ''}">${erasing ? 'Erasing' : 'Painting'}</button>`);
    erase.onclick = () => { erasing = !erasing; buildToolbar(); };
    add(erase);
    const clear = el('<button class="danger">Clear all</button>');
    clear.onclick = () => { camera().mask_cells.cells = []; touch(); };
    add(clear);
    add(el('<span class="spacer"></span>'));
    add(el('<span style="font-size:.82rem;color:var(--ink-soft)"><span class="swatch" style="background:var(--block)"></span>blocked from motion</span>'));
  }

  if (mode === 'rails') {
    const list = camera().tracks;
    const picker = document.createElement('select');
    list.forEach((track, i) => {
      const done = track.rails && track.rails.a && track.rails.a.length > 1
                   && track.rails.b && track.rails.b.length > 1;
      picker.appendChild(new Option(`${track.name}${done ? ' ✓' : ''}`, i));
    });
    if (!list.length) picker.appendChild(new Option('no roads yet', ''));
    picker.value = String(Math.min(trackIndex, Math.max(0, list.length - 1)));
    picker.onchange = () => { trackIndex = Number(picker.value) || 0; buildToolbar(); draw(); };
    add(picker);

    const addRoad = el('<button>+ Road</button>');
    addRoad.onclick = () => {
      list.push({ name: TRACK_NAMES[list.length] || `road ${list.length + 1}`,
                  kind: list.length ? 'siding' : 'running', rails: { a: [], b: [] } });
      trackIndex = list.length - 1; rail = 'a'; touch();
    };
    add(addRoad);

    if (list.length) {
      ['a', 'b'].forEach(key => {
        const track = activeTrack();
        const count = (track.rails && track.rails[key] || []).length;
        const button = el(`<button class="${rail === key ? 'on' : ''}"><span class="swatch" style="background:var(--rail-${key})"></span>Rail ${key.toUpperCase()} (${count})</button>`);
        button.onclick = () => { rail = key; buildToolbar(); draw(); };
        add(button);
      });
      const kind = document.createElement('select');
      ['running', 'loop', 'siding', 'shed'].forEach(k => kind.appendChild(new Option(k, k)));
      kind.value = activeTrack().kind || 'running';
      kind.onchange = () => { activeTrack().kind = kind.value; touch(); };
      add(kind);
    }
  }

  if (mode === 'regions') {
    const list = camera().regions;
    const picker = document.createElement('select');
    list.forEach((region, i) => picker.appendChild(
      new Option(`${region.kind} (${(region.points || []).length} pts)`, i)));
    if (!list.length) picker.appendChild(new Option('no regions yet', ''));
    picker.value = String(Math.min(regionIndex, Math.max(0, list.length - 1)));
    picker.onchange = () => { regionIndex = Number(picker.value) || 0; buildToolbar(); draw(); };
    add(picker);

    const kind = document.createElement('select');
    kind.appendChild(new Option('Platform', 'platform'));
    kind.appendChild(new Option('Blocks the view', 'occluder'));
    if (list.length) kind.value = activeRegion().kind;
    kind.onchange = () => { if (activeRegion()) { activeRegion().kind = kind.value; touch(); } };
    add(kind);

    const addRegion = el('<button>+ Region</button>');
    addRegion.onclick = () => {
      list.push({ name: kind.value, kind: kind.value, points: [] });
      regionIndex = list.length - 1; touch();
    };
    add(addRegion);
  }

  if (mode !== 'paint') {
    add(el('<span class="spacer"></span>'));
    const undo = el('<button>Undo point</button>');
    undo.onclick = () => { const points = editablePoints(); if (points) { points.pop(); touch(); } };
    add(undo);
  }

  const save = el('<button class="primary">Save</button>');
  save.onclick = saveAll;
  add(save);
}

// ---- drawing -----------------------------------------------------------

function pointAtFraction(points, fraction) {
  if (points.length < 2) return points[0];
  const lengths = [0];
  for (let i = 1; i < points.length; i++) {
    lengths.push(lengths[i - 1] + Math.hypot(points[i][0] - points[i - 1][0],
                                             points[i][1] - points[i - 1][1]));
  }
  const total = lengths[lengths.length - 1];
  if (!total) return points[0];
  const target = fraction * total;
  for (let i = 1; i < points.length; i++) {
    if (lengths[i] >= target) {
      const span = lengths[i] - lengths[i - 1];
      const t = span ? (target - lengths[i - 1]) / span : 0;
      return [points[i - 1][0] + (points[i][0] - points[i - 1][0]) * t,
              points[i - 1][1] + (points[i][1] - points[i - 1][1]) * t];
    }
  }
  return points[points.length - 1];
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (image.complete && image.naturalWidth) {
    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#222'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  const entry = camera();
  const visible = layer => mode === layer || showOthers.checked;
  const cw = canvas.width / PAINT_W, ch = canvas.height / PAINT_H;

  if (visible('paint')) {
    ctx.globalAlpha = mode === 'paint' ? 0.45 : 0.2;
    ctx.fillStyle = 'rgb(220,60,60)';
    entry.mask_cells.cells.forEach(cell => {
      ctx.fillRect((cell % PAINT_W) * cw, Math.floor(cell / PAINT_W) * ch, cw, ch);
    });
    ctx.globalAlpha = 1;
  }
  if (mode === 'paint') {
    ctx.strokeStyle = 'rgba(250,244,230,.16)'; ctx.lineWidth = 1;
    for (let c = 1; c < PAINT_W; c++) {
      ctx.beginPath(); ctx.moveTo(c * cw, 0); ctx.lineTo(c * cw, canvas.height); ctx.stroke();
    }
    for (let r = 1; r < PAINT_H; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * ch); ctx.lineTo(canvas.width, r * ch); ctx.stroke();
    }
  }

  if (visible('regions')) {
    entry.regions.forEach(region => {
      const points = region.points || [];
      if (points.length < 2) return;
      const selected = mode === 'regions' && region === activeRegion();
      const rgb = region.kind === 'platform' ? '90,150,220' : '160,120,220';
      ctx.beginPath();
      points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.closePath();
      ctx.fillStyle = `rgba(${rgb},${selected ? 0.3 : 0.14})`; ctx.fill();
      ctx.strokeStyle = `rgba(${rgb},${selected ? 0.95 : 0.5})`;
      ctx.lineWidth = selected ? 3 : 1.5; ctx.stroke();
      if (selected) {
        points.forEach(([x, y]) => {
          ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2);
          ctx.fillStyle = `rgb(${rgb})`; ctx.fill();
          ctx.strokeStyle = '#16130E'; ctx.lineWidth = 2; ctx.stroke();
        });
      }
    });
  }

  let narrow = 0, sparse = false;
  if (visible('rails')) {
    entry.tracks.forEach(track => {
      const rails = track.rails || {};
      const isActive = mode === 'rails' && track === activeTrack();
      const hasPair = rails.a && rails.a.length > 1 && rails.b && rails.b.length > 1;
      if (hasPair) {
        ctx.lineWidth = 1;
        for (let i = 0; i <= 20; i++) {
          const pa = pointAtFraction(rails.a, i / 20);
          const pb = pointAtFraction(rails.b, i / 20);
          const gauge = Math.hypot(pa[0] - pb[0], pa[1] - pb[1]);
          if (isActive && gauge < MIN_GAUGE) narrow++;
          ctx.strokeStyle = gauge < MIN_GAUGE
            ? 'rgba(220,60,60,.9)' : `rgba(250,244,230,${isActive ? 0.3 : 0.12})`;
          ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke();
        }
        if (isActive && (rails.a.length < 3 || rails.b.length < 3)) sparse = true;
      }
      ['a', 'b'].forEach(key => {
        const points = rails[key] || [];
        if (!points.length) return;
        const rgb = key === 'a' ? '255,180,58' : '127,201,127';
        const live = isActive && key === rail;
        if (points.length > 1) {
          ctx.strokeStyle = `rgba(${rgb},${isActive ? 0.95 : 0.4})`;
          ctx.lineWidth = live ? 3 : 2;
          ctx.beginPath();
          points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
          ctx.stroke();
        }
        if (isActive) {
          points.forEach(([x, y], i) => {
            ctx.beginPath(); ctx.arc(x, y, live ? 5 : 3, 0, Math.PI * 2);
            ctx.fillStyle = i === 0 ? '#7FC97F' : `rgb(${rgb})`; ctx.fill();
            ctx.strokeStyle = '#16130E'; ctx.lineWidth = 2; ctx.stroke();
          });
        }
      });
    });
  }

  updateStatus(narrow, sparse);
}

const HINTS = {
  paint: 'Drag over anything that moves but is never a train — platforms with people, roads, car parks, waving trees. Most of our wasted work comes from these.',
  rails: 'Trace both rails of each road, several points each, from the Bishops Lydeard end towards Minehead. Stop before the rails visually meet.',
  regions: 'Outline platforms (a train alongside one is calling, not passing) and anything that hides the track, so a train behind a post does not end its episode.',
};

function plural(count, noun) {
  return `${count} ${noun}${count === 1 ? '' : 's'}`;
}

// What has been annotated for a camera, in the same terms for the status
// line and the progress chips — so a platform drawn in one place is
// visibly counted in the other.
function summarise(entry) {
  const parts = [];
  const roads = (entry.tracks || []).filter(
    t => t.rails && (t.rails.a || []).length > 1 && (t.rails.b || []).length > 1).length;
  const regions = entry.regions || [];
  const of = kind => regions.filter(r => r.kind === kind).length;
  if (roads) parts.push(plural(roads, 'road'));
  if (of('platform')) parts.push(plural(of('platform'), 'platform'));
  if (of('occluder')) parts.push(plural(of('occluder'), 'occluder'));
  const blocked = ((entry.mask_cells || {}).cells || []).length;
  if (blocked) parts.push(`${blocked} blocked`);
  return { parts, roads, regions: regions.length };
}

function updateStatus(narrow, sparse) {
  const entry = camera();
  const notes = [];
  if (mode === 'paint') {
    notes.push(`${entry.mask_cells.cells.length} of ${PAINT_W * PAINT_H} cells blocked`);
  } else if (mode === 'rails') {
    const done = entry.tracks.filter(t => t.rails && t.rails.a && t.rails.a.length > 1
                                          && t.rails.b && t.rails.b.length > 1).length;
    notes.push(`${done}/${entry.tracks.length} roads complete`);
    if (narrow > 1) notes.push('<span class="warn">rails converge — stop before they meet</span>');
    if (sparse) notes.push('<span class="warn">add more points to follow the curve</span>');
  } else {
    const platforms = entry.regions.filter(r => r.kind === 'platform').length;
    const occluders = entry.regions.filter(r => r.kind === 'occluder').length;
    notes.push(entry.regions.length
      ? [platforms && plural(platforms, 'platform'),
         occluders && plural(occluders, 'occluder')].filter(Boolean).join(' · ')
      : 'no regions yet');
  }
  statusEl.innerHTML = notes.join(' · ');
  saveState.textContent = dirty ? 'unsaved changes' : 'saved';
  saveState.style.color = dirty ? 'var(--signal-red)' : 'var(--brass)';
  hintEl.textContent = HINTS[mode];
  buildProgress();
}

function buildProgress() {
  progressEl.innerHTML = '';
  CAMERAS.forEach(([id, label]) => {
    const entry = tracks[id] || {};
    const { parts, roads } = summarise(entry);
    const chip = document.createElement('button');
    chip.className = 'chip' + (roads ? ' done' : '') + (id === cameraSelect.value ? ' current' : '');
    chip.textContent = parts.length ? `${label} · ${parts.join(' · ')}` : label;
    chip.onclick = () => { cameraSelect.value = id; switchCamera(); };
    progressEl.appendChild(chip);
  });
}

// ---- interaction -------------------------------------------------------

function toCanvas(event) {
  const rect = canvas.getBoundingClientRect();
  const clamp = (v, max) => Math.max(0, Math.min(max, Math.round(v)));
  return [clamp((event.clientX - rect.left) * canvas.width / rect.width, canvas.width),
          clamp((event.clientY - rect.top) * canvas.height / rect.height, canvas.height)];
}

function showLoupe(position) {
  const size = 132 / LOUPE_ZOOM;
  loupeCtx.fillStyle = '#111'; loupeCtx.fillRect(0, 0, 132, 132);
  loupeCtx.imageSmoothingEnabled = false;
  loupeCtx.drawImage(canvas, position[0] - size / 2, position[1] - size / 2,
                     size, size, 0, 0, 132, 132);
  loupeCtx.strokeStyle = 'rgba(255,180,58,.9)'; loupeCtx.lineWidth = 1;
  loupeCtx.beginPath();
  loupeCtx.moveTo(56, 66); loupeCtx.lineTo(76, 66);
  loupeCtx.moveTo(66, 56); loupeCtx.lineTo(66, 76);
  loupeCtx.stroke();
  loupe.classList.add('visible');
}

function paintAt(position) {
  const col = Math.floor(position[0] / (canvas.width / PAINT_W));
  const row = Math.floor(position[1] / (canvas.height / PAINT_H));
  if (col < 0 || row < 0 || col >= PAINT_W || row >= PAINT_H) return;
  const cell = row * PAINT_W + col;
  const cells = camera().mask_cells.cells;
  const at = cells.indexOf(cell);
  if (erasing) { if (at >= 0) cells.splice(at, 1); }
  else if (at < 0) cells.push(cell);
}

// A quick drag fires pointermove only every few cells, leaving holes along the
// stroke. Fill in the line between samples so the brush is continuous.
function paintStroke(to) {
  const from = lastPaint || to;
  const step = Math.min(canvas.width / PAINT_W, canvas.height / PAINT_H) / 2;
  const span = Math.hypot(to[0] - from[0], to[1] - from[1]);
  const steps = Math.max(1, Math.ceil(span / step));
  for (let i = 1; i <= steps; i++) {
    paintAt([from[0] + (to[0] - from[0]) * i / steps,
             from[1] + (to[1] - from[1]) * i / steps]);
  }
  if (!lastPaint) paintAt(to);
  lastPaint = to;
}

function nearestPoint(position, within) {
  const points = editablePoints();
  if (!points) return null;
  let best = null;
  points.forEach((point, index) => {
    const distance = Math.hypot(point[0] - position[0], point[1] - position[1]);
    if (distance <= within && (!best || distance < best.distance)) best = { index, distance };
  });
  return best;
}

canvas.addEventListener('pointerdown', event => {
  canvas.setPointerCapture(event.pointerId);
  const position = toCanvas(event);
  if (mode === 'paint') { dragging = 'paint'; lastPaint = null; paintStroke(position); touch(); return; }
  const points = editablePoints();
  if (!points) return;
  const near = nearestPoint(position, event.pointerType === 'touch' ? 26 : 12);
  if (near) dragging = near.index;
  else { points.push(position); dragging = points.length - 1; }
  touch(); showLoupe(position);
});
canvas.addEventListener('pointermove', event => {
  if (dragging === null) return;
  const position = toCanvas(event);
  if (dragging === 'paint') { paintStroke(position); touch(); return; }
  const points = editablePoints();
  if (points) { points[dragging] = position; touch(); showLoupe(position); }
});
function endDrag() { dragging = null; lastPaint = null; loupe.classList.remove('visible'); }
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

// ---- plumbing ----------------------------------------------------------

function touch() { dirty = true; buildToolbar(); draw(); }

function switchCamera() {
  trackIndex = 0; regionIndex = 0; rail = 'a';
  image = new Image();
  image.onload = draw;
  image.onerror = () => { statusEl.textContent = 'reference frame missing'; draw(); };
  image.src = `working_images/cam_${cameraSelect.value}.jpg`;
  buildToolbar(); draw();
}

async function saveAll() {
  saveState.textContent = 'saving…';
  try {
    const response = await fetch('/save-tracks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(tracks, null, 1),
    });
    dirty = !response.ok;
    saveState.textContent = response.ok ? 'saved' : 'save failed';
    saveState.style.color = response.ok ? 'var(--brass)' : 'var(--signal-red)';
  } catch {
    saveState.textContent = 'save failed';
    saveState.style.color = 'var(--signal-red)';
  }
}

document.querySelectorAll('.mode').forEach(button => {
  button.onclick = () => {
    mode = button.dataset.mode;
    document.querySelectorAll('.mode').forEach(other =>
      other.setAttribute('aria-pressed', String(other === button)));
    buildToolbar(); draw();
  };
});
cameraSelect.onchange = switchCamera;
showOthers.onchange = draw;
window.addEventListener('beforeunload', event => {
  if (dirty) { event.preventDefault(); event.returnValue = ''; }
});

fetch('camera_tracks.json', { cache: 'no-store' })
  .then(response => response.ok ? response.json() : {})
  .catch(() => ({}))
  .then(data => {
    Object.entries(data).forEach(([key, value]) => {
      if (!key.startsWith('_')) tracks[key] = value;
    });
    switchCamera();
  });
</script>
